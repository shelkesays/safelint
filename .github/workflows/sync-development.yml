name: Sync development with main

# After every push to main (a merged release + the auto-release workflow's
# CHANGELOG date-stamp commit), reset development to main so the two never
# diverge. That divergence is what forces squash-over-rebase: main carries a
# squashed release commit while development carries the individual commits, so
# the next release branch cut from development cannot rebase onto main. Keeping
# development identical to main after each release removes the whole class.
#
# Archive-then-reset: development's tip is pushed to an `archive/development-<sha>`
# branch and only then reset. Nothing is ever unrecoverable, so the job never
# needs to predict whether a reset is safe - and it never refuses.
#
# It USED to refuse unless it could prove development's content was already in
# main, via patch-id (`git cherry`). That cannot work for this repository, and
# the 2.15.0 release is the worked example - every candidate predicate was tested
# against it and every one refused:
#
#   * `git cherry` patch-id    - 11 commits read as not-upstream. A squash merge
#                                collapses N commits into ONE patch-id, which
#                                matches none of the N. The check was written for
#                                rebase-merge semantics; this repo squash-merges.
#   * tree equality            - 6 files differ.
#   * development's tree found
#     anywhere in main history - never present.
#   * net-diff reverse-apply   - fails on uv.lock and pyproject.toml.
#   * ...excluding those       - fails on CHANGELOG.md, docs and the workflows.
#
# The reason is structural, not a bug in the predicate: after a release main is
# AHEAD of development in the same files (the date-stamped CHANGELOG, any fix
# folded into the release branch, the version going rcN -> final), so
# "development's content is in main" is not computable by comparing current
# states. Development also legitimately holds a string main never had, the rc
# version, so it is never literally a content subset.
#
# The only sound signal would be lineage - was anything pushed to development
# after the release branch was cut - which needs the cut point recorded at
# release time. Archiving is simpler and strictly safer than what it replaces:
# when the old guard PASSED it force-pushed with no backup at all.
#
# Loop safety: this force-pushes development, which triggers publish.yml on the
# development branch. After the reset development == main (a final version), and
# publish.yml only releases an rc from development, so its gate skips. No loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read  # the force-push and the archive push both go through RELEASE_PAT

concurrency:
  group: sync-development
  cancel-in-progress: false

jobs:
  sync:
    name: Archive development, then reset it to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Do not persist the token in .git/config (defence-in-depth, matches
          # publish.yml). The force-push injects RELEASE_PAT via an explicit URL.
          persist-credentials: false

      - name: Archive development, then reset it to main
        env:
          # RELEASE_PAT: force-pushing development needs to bypass its protection
          # (the default GITHUB_TOKEN cannot). Same token as publish.yml.
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          git fetch origin main development --quiet

          DEV=$(git rev-parse origin/development)
          MAIN=$(git rev-parse origin/main)
          DEV_SHORT=$(git rev-parse --short "$DEV")

          if [ "$DEV" = "$MAIN" ]; then
            echo "development already equals main - nothing to do."
            exit 0
          fi

          # Push via an explicit PAT URL (credentials are not persisted).
          REPO_URL="https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"
          ARCHIVE="archive/development-${DEV_SHORT}"

          # Archive BEFORE the reset, and let `set -e` abort if it fails: after
          # the force-push this branch is the only copy of the old tip. The name
          # embeds the SHA, so re-running pushes the same commit to the same ref
          # and is a no-op rather than an error.
          #
          # No workflow triggers on `archive/*` (ci.yml and publish.yml both list
          # main / development / release/* only), so this costs no runs. Safe to
          # delete once the release is confirmed.
          git push "$REPO_URL" "$DEV:refs/heads/$ARCHIVE"
          echo "::notice::archived development tip $DEV_SHORT to $ARCHIVE"

          # Push main's commit straight at the remote ref rather than moving a
          # local branch first: `git branch -f development` fails outright if
          # that branch happens to be checked out, and nothing here needs a local
          # branch. --force-with-lease guards against a race between the read
          # above and this push.
          git push --force-with-lease=development:"$DEV" "$REPO_URL" "$MAIN:refs/heads/development"
          echo "::notice::development reset to main ($(git rev-parse --short "$MAIN")); previous tip kept at $ARCHIVE"
