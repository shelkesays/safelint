name: Sync development with main

# After every push to main (a merged release + the auto-release workflow's
# CHANGELOG date-stamp commit), reset development to main so the two never
# diverge. That divergence is what forces squash-over-rebase: main carries a
# squashed release commit while development carries the individual commits, so
# the next release branch cut from development cannot rebase onto main. Keeping
# development identical to main after each release removes the whole class.
#
# Two safeguards, in this order:
#
#   1. A VERSION CHECK decides whether development's extra commits were already
#      shipped. Development is reset only when it is a plain ancestor of main
#      (nothing to lose) or carries a prerelease of a version main has already
#      released (the rc commits of that release). Anything else - next cycle's
#      rc, or work merged with no version bump - is left alone with a warning.
#   2. ARCHIVE-THEN-RESET: when a reset does go ahead, development's tip is
#      pushed to an `archive/development-<sha>` branch first, so even a wrong
#      decision is recoverable.
#
# Safeguard 1 was added after the reset had been unconditional for two releases.
# Unconditional was defensible on the grounds that nothing is unrecoverable, but
# the recovery is manual and the loss is silent: this workflow triggers on EVERY
# push to main, not just releases, so a docs fix or a folded dependabot bump
# would quietly wipe whatever was on development, mid-RC work included.
#
# The version check works where content comparison cannot. It USED to refuse
# unless it could prove development's content was already in main, via patch-id
# (`git cherry`). That cannot work for this repository, and the 2.15.0 release is
# the worked example - every candidate predicate was tested against it and every
# one refused:
#
#   * `git cherry` patch-id    - 11 commits read as not-upstream. A squash merge
#                                collapses N commits into ONE patch-id, which
#                                matches none of the N. The check was written for
#                                rebase-merge semantics; this repo squash-merges.
#   * tree equality            - 6 files differ.
#   * development's tree found
#     anywhere in main history - never present.
#   * net-diff reverse-apply   - fails on uv.lock and pyproject.toml.
#   * ...excluding those       - fails on CHANGELOG.md, docs and the workflows.
#
# The reason is structural, not a bug in the predicate: after a release main is
# AHEAD of development in the same files (the date-stamped CHANGELOG, any fix
# folded into the release branch, the version going rcN -> final), so
# "development's content is in main" is not computable by comparing current
# states. Development also legitimately holds a string main never had, the rc
# version, so it is never literally a content subset.
#
# Lineage - was anything pushed to development after the release branch was cut -
# is the sound signal, and the cut point IS recorded: publish.yml tags every
# release, so `v<development's version>` points at whatever development's tip was
# when that prerelease published. Both signals are now required. The VERSION says
# development is a prerelease of something main has already released; the TAG
# says this exact commit is what that prerelease shipped. Version alone would
# approve a development that grew commits after the release branch was cut.
#
# Archiving remains, and is strictly safer than what the patch-id guard did:
# when that guard PASSED it force-pushed with no backup at all.
#
# Loop safety: this force-pushes development, which triggers publish.yml on the
# development branch. After the reset development == main (a final version), and
# publish.yml only releases an rc from development, so its gate skips. No loop.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read  # the force-push and the archive push both go through RELEASE_PAT

concurrency:
  group: sync-development
  cancel-in-progress: false

jobs:
  sync:
    name: Archive development, then reset it to main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Do not persist the token in .git/config (defence-in-depth, matches
          # publish.yml). The force-push injects RELEASE_PAT via an explicit URL.
          persist-credentials: false

      - name: Archive development, then reset it to main
        env:
          # RELEASE_PAT: force-pushing development needs to bypass its protection
          # (the default GITHUB_TOKEN cannot). Same token as publish.yml.
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          set -euo pipefail
          git fetch origin main development --quiet

          MAIN=$(git rev-parse origin/main)

          # Push via an explicit PAT URL (credentials are not persisted).
          REPO_URL="https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git"

          # Reporting for every path that does NOT leave development at main.
          # It re-reads the remote rather than asserting what happened: a lease
          # rejection on the last attempt can coincide with another writer
          # having already set development to main, and a dropped response can
          # hide a push that did land, so "the reset failed" does not imply
          # "development is unchanged". Returns success when development turns
          # out to equal main anyway, which is the job's actual goal.
          report_not_reset() {
            FINAL=$(git ls-remote "$REPO_URL" refs/heads/development 2>/dev/null | cut -f1 || true)
            {
              echo "### development was not reset by this run"
              echo
              echo "- $1"
              if [ -z "$FINAL" ]; then
                echo "- development could not be re-read from the remote, so its current state is unconfirmed"
              elif [ "$FINAL" = "$MAIN" ]; then
                echo "- re-read after the failure: development already equals main (\`${MAIN:0:7}\`), so nothing is pending"
              else
                echo "- re-read after the failure: development is at \`${FINAL:0:7}\`, main is at \`${MAIN:0:7}\`"
              fi
              echo "- tips archived before each attempt: ${FAILED_ARCHIVES:-none}"
              echo "- git's own message for the rejected push is in the step log"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            [ -n "$FINAL" ] && [ "$FINAL" = "$MAIN" ]
          }

          # Split "X.Y.Z" / "X.Y.ZrcN" into "<major> <minor> <patch> <is_prerelease>".
          # Returns non-zero for anything else, which is what makes the guard
          # below fail closed on a version scheme it does not understand.
          # The prerelease suffixes accepted here MUST match the set
          # publish.yml classifies as a pre-release, which is
          # `grep -qiE '(rc|a|b|\.dev)[0-9]*$'` - case-insensitive, four
          # families, digits optional. The first version of this parser took
          # only lowercase `rcN`, so a legitimate `2.16.0b1` or `2.16.0RC1`
          # released from development would fail to parse, the guard would fail
          # closed, and development would stay unsynced until someone noticed
          # and dispatched the workflow by hand. Lowercased with `tr` rather
          # than `${1,,}` because macOS ships bash 3.2 and the sandbox harness
          # runs there.
          parse_version() {
            local lowered
            lowered=$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')
            if [[ "$lowered" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)((rc|a|b|\.dev)[0-9]*)?$ ]]; then
              if [ -n "${BASH_REMATCH[4]}" ]; then
                echo "${BASH_REMATCH[1]} ${BASH_REMATCH[2]} ${BASH_REMATCH[3]} 1"
              else
                echo "${BASH_REMATCH[1]} ${BASH_REMATCH[2]} ${BASH_REMATCH[3]} 0"
              fi
              return 0
            fi
            return 1
          }

          # Decide whether development's extra commits are already shipped, and
          # print the reason either way (the caller puts it in the annotation).
          #
          # The reset used to be unconditional, so any push to main - a docs
          # fix, a folded dependabot bump, a security patch - wiped whatever was
          # sitting on development, mid-RC work included. It was archived first,
          # so nothing was unrecoverable, but recovery was manual and the loss
          # was silent until someone noticed.
          #
          # Version comparison is the signal that works here. Every
          # content-based predicate failed (see the header): after a release
          # main is AHEAD of development in the same files, so "development's
          # content is in main" is not computable from current state. The
          # VERSION, though, says what development IS:
          #
          #   * a prerelease of a version <= main's -> the rc commits of what
          #     main just released. Stale by construction; reset.
          #   * a prerelease of a LATER version (2.16.0rc1 against main's
          #     2.15.0) -> the next cycle, in flight. Skip.
          #   * not a prerelease at all -> work merged with no version bump,
          #     such as a folded dependabot PR. Never shipped; skip.
          parse_failed=""
          reset_is_safe() {
            local dev_parsed main_parsed dev_major dev_minor dev_patch dev_is_rc main_major main_minor main_patch main_is_rc
            if ! dev_parsed=$(parse_version "$1"); then
              echo "development's version ($1) could not be parsed"
              return 1
            fi
            if ! main_parsed=$(parse_version "$2"); then
              echo "main's version ($2) could not be parsed"
              return 1
            fi
            read -r dev_major dev_minor dev_patch dev_is_rc <<< "$dev_parsed"
            read -r main_major main_minor main_patch main_is_rc <<< "$main_parsed"
            if [ "$dev_is_rc" -eq 0 ]; then
              echo "development is not a prerelease, so its commits never shipped as one"
              return 1
            fi
            # main carrying a prerelease means nothing has been released as
            # final, so development's rc commits may not have shipped either and
            # there is nothing to reset over. publish.yml only releases a final
            # from main, so this should not arise - but `main_is_rc` was being
            # parsed and then ignored, which left the one case it exists for
            # unhandled.
            if [ "$main_is_rc" -ne 0 ]; then
              echo "main is itself at a prerelease ($2), so no final release has shipped"
              return 1
            fi
            # Single comparable integer. Minor and patch are assumed below 1000,
            # which has held for every release and is a safe assumption for a
            # project that has never shipped a .1000.
            if [ $((dev_major * 1000000 + dev_minor * 1000 + dev_patch)) -gt $((main_major * 1000000 + main_minor * 1000 + main_patch)) ]; then
              echo "development is a prerelease of a LATER version than main has released"
              return 1
            fi
            echo "development is a prerelease of what main has already released"
            return 0
          }

          # Was development's tip actually PUBLISHED as that prerelease?
          #
          # reset_is_safe compares version numbers only, so on its own it
          # approves any prerelease at or below main's - including a development
          # that grew commits after the release branch was cut, which therefore
          # never shipped. The file header used to say that answering this needs
          # "the cut point recorded at release time"; it is recorded. publish.yml
          # tags every release `v<version>`, so the rc tag points at whatever
          # development's tip was when that rc was published. A tip that has
          # moved since carries commits the release does not have.
          #
          # No tag means the rc was never published - bumped but not merged, or
          # the publish failed - so that fails closed as well.
          tip_is_the_published_rc() {
            local tag="v$1" tagged
            git fetch --quiet "$REPO_URL" "+refs/tags/${tag}:refs/tags/${tag}" 2>/dev/null || return 1
            # rev-list resolves an annotated tag to its commit; `rev-parse` on
            # one would return the tag OBJECT and never match a branch tip.
            tagged=$(git rev-list -n 1 "$tag" 2>/dev/null) || return 1
            [ "$tagged" = "$2" ]
          }

          # Report a refusal to reset. Two callers now, so it lives in one place.
          skip_reset() {
            echo "::warning::development NOT reset: it has $1 commit(s) main lacks and $3. Land that work on main, or dispatch this workflow once it has shipped."
            {
              echo "### development left as it is"
              echo
              echo "- development \`$2\` has \`$1\` commit(s) not reachable from main \`${MAIN:0:7}\`"
              echo "- $3"
              echo "- nothing was archived or reset; this is the guard against a push to main discarding unshipped work"
              echo "- to sync anyway, land that work on main first, or re-run this workflow once it has shipped"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          }

          # Read project.version out of a commit without checking it out.
          version_at() {
            git show "$1:pyproject.toml" | python3 -c 'import sys, tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])' 2>/dev/null || echo "<unreadable>"
          }

          # Retry the archive-and-reset pair, re-reading development's tip each
          # time. --force-with-lease rejects the push if development moved between
          # the read and the write, and nothing else would retry: this workflow
          # triggers on pushes to MAIN, so a lost race would otherwise leave the
          # branches unsynced until the next release or a manual dispatch.
          # Re-reading means the new tip is archived too, so a racing push is
          # preserved rather than skipped.
          for attempt in 1 2 3; do
            DEV=$(git ls-remote "$REPO_URL" refs/heads/development | cut -f1)
            if [ -z "$DEV" ]; then
              echo "::error::development branch not found on the remote."
              exit 1
            fi
            if [ "$DEV" = "$MAIN" ]; then
              echo "development already equals main - nothing to do."
              exit 0
            fi
            DEV_SHORT=$(git rev-parse --short "$DEV" 2>/dev/null || echo "${DEV:0:7}")
            ARCHIVE="archive/development-${DEV_SHORT}"

            # Fetch development's tip before anything reads it: the count below,
            # the version read and the archive push all need its objects.
            git fetch --quiet "$REPO_URL" "$DEV"

            # How much of development is not reachable from main. Zero means
            # development is a plain ancestor, the reset is provably lossless,
            # and no version check is needed - that case gets a notice, not a
            # warning (the first real run of this workflow hit it and the
            # warning was pure noise). Above zero, the versions decide.
            AHEAD=$(git rev-list --count "$MAIN..$DEV")
            if [ "$AHEAD" -gt 0 ]; then
              DEV_VERSION=$(version_at "$DEV")
              MAIN_VERSION=$(version_at "$MAIN")
              # Two independent questions, both of which must answer yes:
              # does the VERSION say development is a shipped prerelease, and is
              # this exact COMMIT the one that prerelease published?
              if ! VERDICT=$(reset_is_safe "$DEV_VERSION" "$MAIN_VERSION"); then
                skip_reset "$AHEAD" "$DEV_SHORT" "version check: $VERDICT (development \`$DEV_VERSION\`, main \`$MAIN_VERSION\`)"
                exit 0
              fi
              if ! tip_is_the_published_rc "$DEV_VERSION" "$DEV"; then
                skip_reset "$AHEAD" "$DEV_SHORT" "development's tip is not the commit published as \`v$DEV_VERSION\`, so it has grown commits since that prerelease shipped (or that prerelease was never published)"
                exit 0
              fi
              echo "::notice::development has $AHEAD commit(s) main lacks, but $VERDICT ($DEV_VERSION against $MAIN_VERSION) and its tip is the commit published as v$DEV_VERSION; resetting."
            fi

            # Archive BEFORE the reset, and let a failure here abort the attempt:
            # after the force-push this branch is the only copy of the old tip.
            # The name embeds the SHA, so a re-run pushes the same commit to the
            # same ref and is a no-op rather than an error.
            #
            # No workflow triggers on `archive/*` (ci.yml and publish.yml both
            # list main / development / release/* only), so this costs no runs.
            # Safe to delete once the release is confirmed.
            git push "$REPO_URL" "$DEV:refs/heads/$ARCHIVE"

            # Push main's commit straight at the remote ref rather than moving a
            # local branch first: `git branch -f development` fails outright if
            # that branch happens to be checked out, and nothing here needs a
            # local branch.
            #
            # Everything is reported AFTER this push succeeds, never before: an
            # attempt that loses the lease retries with a different tip, so a
            # report written ahead of the push would be duplicated per attempt
            # and - if all three attempts failed - would claim a sync that never
            # happened.
            PUSH_LOG=$(mktemp)
            if git push --force-with-lease=development:"$DEV" "$REPO_URL" "$MAIN:refs/heads/development" >"$PUSH_LOG" 2>&1; then
              cat "$PUSH_LOG"
              if [ "$AHEAD" -eq 0 ]; then
                echo "::notice::development was an ancestor of main ($AHEAD commits ahead); reset is lossless. Previous tip archived at $ARCHIVE."
              else
                echo "::warning::development had $AHEAD commit(s) not reachable from main; they are preserved at $ARCHIVE - recover from there if the release did not just ship them"
              fi
              {
                echo "### development synced to main"
                echo
                echo "- previous tip \`$DEV_SHORT\` archived to \`$ARCHIVE\`"
                if [ "$AHEAD" -eq 0 ]; then
                  echo "- development was an ancestor of main, so nothing was unreachable; the reset is lossless"
                else
                  echo "- \`$AHEAD\` commit(s) were not reachable from main (expected after a squash release)"
                  echo "- recover with \`git fetch origin $ARCHIVE\` if that work had not been released"
                fi
              } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "::notice::development reset to main ($(git rev-parse --short "$MAIN")); previous tip kept at $ARCHIVE"
              exit 0
            fi
            cat "$PUSH_LOG"
            FAILED_ARCHIVES="${FAILED_ARCHIVES:+$FAILED_ARCHIVES, }$ARCHIVE"

            # A lost lease is the only rejection a retry can fix, and git names
            # it: `(stale info)`. Anything else - branch protection, a revoked
            # token, a pre-receive hook, a transport error - will be rejected
            # the same way three times, and "re-run once pushes have settled"
            # would send the operator looking for a race that never happened.
            # So retry only on the stale lease, and otherwise stop at the first
            # rejection and point at git's message.
            #
            # Anchored on git's own per-ref rejection line rather than searched
            # for anywhere in the log: the rest of the output is text the remote
            # supplied (a hook's stderr is echoed verbatim as `remote:`), and
            # that must not be able to talk this into retrying.
            if ! grep -qE '^[[:space:]]*! \[rejected\].*\(stale info\)' "$PUSH_LOG"; then
              if report_not_reset "the reset push was rejected for a reason a retry cannot fix (not a lost lease)"; then
                echo "::notice::the reset push was rejected, but development already equals main; the sync is satisfied"
                exit 0
              fi
              echo "::error::the reset push to development was rejected and retrying cannot help (not a lost lease). See git's message in this step's log."
              exit 1
            fi
            echo "::warning::attempt $attempt was rejected as stale, so development moved after it was read; re-reading and retrying"
          done

          if report_not_reset "development kept moving: all 3 attempts lost the lease between reading its tip and pushing"; then
            echo "::notice::the retries were exhausted, but development already equals main; the sync is satisfied"
            exit 0
          fi
          echo "::error::could not reset development after 3 attempts - the lease was stale every time, so pushes to development are still arriving. Re-run this workflow once they have settled."
          exit 1
