name: CI

on:
  push:
    branches: [main, development, "release/*"]
  pull_request:
    # Include `development` so feature -> development RC PRs get the full
    # lint/test/self-lint matrix BEFORE merge. Without it, a merge to
    # `development` triggers publish.yml (which auto-releases a new RC to PyPI)
    # and ci.yml independently, so a broken RC could publish while CI fails
    # separately - pre-merge validation on the PR closes that gap.
    branches: [main, development, "release/*"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Least privilege: nothing after checkout does git operations, so keep
          # GITHUB_TOKEN out of .git/config (matches claude-review.yml).
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/ scripts/

      - name: Format check (ruff)
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Type check (ty)
        run: uv run ty check src/ scripts/ tests/

      - name: Self-lint (safelint must pass itself)
        # CLAUDE.md mandates that ``safelint check src/`` produces zero
        # blocking violations before merging - pre-commit enforces this
        # locally, this step enforces it at the CI tier so a push that
        # bypasses pre-commit can't slip through. ``--fail-on=warning``
        # is the strict CI mode (``--mode=ci`` default), so warnings block
        # too - safelint's own source is warning-clean. ``scripts/`` and
        # ``tests/`` are linted too: their per-file-ignores live in
        # ``safelint.toml`` (``scripts/**`` drops the CLI-inherent
        # SAFE304/SAFE203; ``tests/fixtures/**`` is deliberately non-compliant
        # so it drops every rule; ``tests/**`` relaxes the structure/style
        # rules test scaffolding trips). ``check`` accepts multiple paths, so
        # all three lint in one invocation.
        run: |
          uv run safelint check src/ scripts/ tests/ --all-files --fail-on=warning

  changelog-history:
    # Refuses a change that edits the notes of an already-released version
    # (#278). The failure it catches is silent: a rebase across a release
    # merges a branch's `[Unreleased]` entries into the dated section without
    # conflicting, because the subsection headings match either side. That
    # happened four times in one day and every instance was caught by hand.
    #
    # Pull requests only. On a push there is no base to compare against, and
    # the release workflow legitimately rewrites `[Unreleased]` into a dated
    # section as it tags.
    name: CHANGELOG history
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The base branch has to be reachable for `git show <base>:CHANGELOG.md`,
          # and a shallow clone does not contain it.
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.12"

      - name: Released CHANGELOG sections are unchanged
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          uv run --no-project python scripts/check_changelog_history.py \
            --base-ref "origin/${{ github.base_ref }}"

  test:
    name: Test / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      # Ubuntu across every supported Python, plus ONE Windows job.
      #
      # Windows is here because safelint is full of path handling - test-dir
      # membership, changed-set matching, symlink containment, drive letters -
      # and an ubuntu-only matrix structurally cannot see a bug in any of it.
      # #265 (SAFE702 never firing on Windows while the same commit failed on
      # Linux CI) went unreproducible for exactly that reason.
      #
      # One Windows job rather than four: the bugs this catches are
      # platform-dependent, not Python-version-dependent, so a second Windows
      # Python would mostly re-run the same assertions at twice the cost.
      # 3.12 is the midpoint of the supported range.
      #
      # ``pytest_args`` carries ``--no-cov`` on Windows. Coverage is enforced on
      # the canonical environment (the Ubuntu jobs, which gate at 97%); on
      # Windows a number of tests are legitimately skipped - a filename with a
      # control character cannot exist there, and the harness fixtures are
      # ``#!/bin/sh`` scripts Windows cannot execute - so their lines never run
      # and the percentage is structurally lower (96.90% when measured).
      # Enforcing the same threshold on both would force a choice between
      # deleting honest skips and lowering the gate for everyone. This job is
      # here to catch platform BEHAVIOUR, which it does either way.
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            label: Python 3.11
            pytest_args: ""
          - os: ubuntu-latest
            python-version: "3.12"
            label: Python 3.12
            pytest_args: ""
          - os: ubuntu-latest
            python-version: "3.13"
            label: Python 3.13
            pytest_args: ""
          - os: ubuntu-latest
            python-version: "3.14"
            label: Python 3.14
            pytest_args: ""
          - os: windows-latest
            python-version: "3.12"
            label: Windows / Python 3.12
            pytest_args: "--no-cov"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Least privilege: nothing after checkout does git operations, so keep
          # GITHUB_TOKEN out of .git/config (matches claude-review.yml).
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -q ${{ matrix.pytest_args }}
