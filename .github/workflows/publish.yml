name: Publish to PyPI

# Branch-triggered auto-release. The signal to release is the version in
# ``pyproject.toml`` (a deliberate, committed edit): when a merge lands a
# version that is not yet tagged, on its expected branch, this workflow tags
# it, publishes to PyPI, and creates the GitHub release. RC versions
# (``X.Y.ZrcN`` / a / b / .dev) release from ``development`` as pre-releases;
# final versions (``X.Y.Z``) release from ``main``.
#
# On a final release it also date-stamps the CHANGELOG
# (``[Unreleased] -> [X.Y.Z] - <date>``) and commits that to ``main`` before
# tagging, so the separate manual dating step goes away.
#
# The workflow name is kept as ``publish.yml`` so the PyPI Trusted-Publishing
# trust (owner + repo + workflow filename + ``pypi`` environment) is unchanged.
#
# PyPI setup (one-time): pypi.org -> project -> Manage -> Publishing -> trusted
# publisher: owner ``shelkesays``, repo ``safelint``, workflow ``publish.yml``,
# environment ``pypi``. Ensure it is NOT pinned to a specific ref, since this
# now runs on branch pushes rather than tag pushes.
#
# Loop safety: the final-release path pushes the CHANGELOG date-stamp commit to
# ``main``, which re-triggers this workflow. The gate below then finds the tag
# already exists and skips - no loop. The tag is pushed BEFORE the branch commit
# so the re-triggered gate is guaranteed to see it.

on:
  push:
    branches: [main, development]

# Deliberately NO `workflow_dispatch`. A dispatch runs the workflow file FROM
# THE SELECTED REF, so it was a route for anyone with write access to hand
# arbitrary job code the release credentials (#282). Its stated purpose,
# re-publishing after a PyPI upload failed once the tag existed, is served by
# "Re-run failed jobs" in the Actions UI, which re-runs the recorded commit
# rather than arbitrary code.

permissions:
  contents: read

concurrency:
  # Serialise releases per branch so two rapid version bumps cannot race the
  # same tag. Do not cancel in progress - a release must finish.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether to release
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # need tags for the "already released" check
          persist-credentials: false

      - id: decide
        run: |
          set -euo pipefail
          VERSION=$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Classify: PEP 440 pre-release (rc/a/b/.dev) -> from development;
          # otherwise a final release -> from main. Case-insensitive (-i) so an
          # uppercase suffix like 2.9.0RC1 is not misclassified as final - mirrors
          # the changelog_section.py fix.
          if printf '%s' "$VERSION" | grep -qiE '(rc|a|b|\.dev)[0-9]*$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            EXPECTED_BRANCH=development
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            EXPECTED_BRANCH=main
          fi

          # Guard 1: version type must match the branch it landed on.
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_BRANCH" ]; then
            echo "::notice::version $VERSION is not releasable from $GITHUB_REF_NAME (expected $EXPECTED_BRANCH) - skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Guard 2: never release a version that is already tagged (the common
          # case for a push that did not bump the version).
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::notice::tag v$VERSION already exists - skipping"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::releasing v$VERSION from $GITHUB_REF_NAME"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Date changelog, tag, build
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      # This job holds RELEASE_PAT on the final path, so it has to declare the
      # environment that owns it. RELEASE_PAT is an ENVIRONMENT secret of
      # `release-write` whose deployment branch policy admits `main` only, which
      # is what actually protects it (#282): the secret is unreadable without
      # the declaration, and the declaration only works on a run whose ref is
      # `main`, i.e. a reviewed commit.
      #
      # RCs never need the token - their only write is a tag push, done with the
      # run's own ephemeral token below - so they deploy to the rule-free
      # `pypi-rc` instead. That keeps RC releases hands-off and keeps this
      # expression resolving to a real name in both directions, which an
      # environment declaration requires.
      name: ${{ needs.gate.outputs.prerelease == 'true' && 'pypi-rc' || 'release-write' }}

    permissions:
      contents: write  # the RC tag push, via the run's own token

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Do NOT persist the token in .git/config: ``uv build`` below runs the
          # build backend, so a persisted RELEASE_PAT could be read by backend
          # code. The push step instead injects the PAT into an explicit remote
          # URL for that single command.
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.11"

      - name: Date CHANGELOG (final only), tag, and push
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
          # Finals push the CHANGELOG date-stamp commit to protected main, which
          # the run's own token cannot do (it is not in the ruleset's bypass
          # list), so that path needs RELEASE_PAT. Being an environment secret of
          # `release-write`, it resolves ONLY on the final path, where this job
          # deploys there - on the RC path it is empty by construction rather
          # than by convention. Passed as an env var + explicit URL, never
          # persisted.
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
          # RCs only push a tag, and no ruleset targets tags, so the run's own
          # ephemeral token is enough and no long-lived credential is exposed to
          # the RC path at all.
          RUN_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          COMMITTED=false
          if [ "$PRERELEASE" = "false" ]; then
            # Fail loudly rather than attempt an anonymous push: an empty PAT
            # here means the environment lost the secret or its branch policy
            # rejected this ref, and a bare authentication error says neither.
            if [ -z "$RELEASE_PAT" ]; then
              echo "::error::RELEASE_PAT is empty on the final path. Check that the release-write environment still holds it and that its deployment branch policy admits main."
              exit 1
            fi
            PUSH_TOKEN="$RELEASE_PAT"

            DATE=$(date -u +%Y-%m-%d)
            python3 scripts/date_changelog.py "$VERSION" "$DATE"
            if ! git diff --quiet -- CHANGELOG.md; then
              git add CHANGELOG.md
              git commit -m "chore: date CHANGELOG for v$VERSION"
              COMMITTED=true
            fi
          else
            PUSH_TOKEN="$RUN_TOKEN"
          fi
          REPO_URL="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Tag the (possibly date-stamped) HEAD. When a CHANGELOG commit was
          # made, push the tag AND the branch commit ATOMICALLY so the tag can
          # never exist without its dated CHANGELOG landing on the branch - a
          # non-atomic tag-then-branch would, on a branch-push failure, leave
          # the release tagged but the CHANGELOG un-dated forever (the
          # "already tagged" gate then skips every future retry). The branch
          # push re-triggers this workflow, but the tag is already present so
          # the gate skips (loop-safe); the tag push itself does not re-trigger
          # (this workflow is branch-triggered, not tag-triggered).
          git tag "v$VERSION"
          if [ "$COMMITTED" = "true" ]; then
            git push --atomic "$REPO_URL" "v$VERSION" "HEAD:$GITHUB_REF_NAME"
          else
            git push "$REPO_URL" "v$VERSION"
          fi

      - name: Verify tag matches project version
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )
          if [ "v${PROJECT_VERSION}" != "v${VERSION}" ]; then
            echo "Error: project.version changed under the release - aborting"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: python3 scripts/changelog_section.py "$VERSION" > release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [gate, build]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      # Finals deploy to the reviewer-gated ``pypi`` environment - a human
      # approves before the production upload (the safety valve). RC publishing
      # is hands-off via ``pypi-rc`` (an environment with no reviewer rule).
      # PyPI setup: either leave the trusted-publisher's Environment field blank
      # so it trusts this workflow from any environment (simplest - one entry
      # covers both), or add a second trusted-publisher entry for ``pypi-rc``.
      name: ${{ needs.gate.outputs.prerelease == 'true' && 'pypi-rc' || 'pypi' }}
      url: https://pypi.org/p/safelint

    permissions:
      id-token: write  # required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: Create GitHub release
    needs: [gate, build, publish]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write  # gh release create

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes
          path: .

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
          PRERELEASE: ${{ needs.gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          # This job does NOT check out the repo (it only needs the notes
          # artifact), so there is no local .git. Target the repo via GH_REPO and
          # drop --verify-tag, which shells out to local git and would fail with
          # "not a git repository". The tag is guaranteed to exist already: the
          # build job created + pushed it, and this job needs [build, publish].
          FLAGS=(--title "v$VERSION" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
          gh release create "v$VERSION" "${FLAGS[@]}"
