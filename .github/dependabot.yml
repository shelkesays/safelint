# Dependabot keeps the SHA-pinned GitHub Actions fresh. Actions are pinned to
# full commit SHAs (with a trailing `# vX.Y.Z` comment) for supply-chain
# safety - see the security-hardening plan, item H9. Dependabot understands
# SHA-pinned actions and will raise PRs that bump both the SHA and the comment
# when a new release ships, so pinning does not mean going stale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Raise bumps against the default branch, ``main``.
    #
    # They used to target ``development`` so that action updates flowed through
    # the normal feature/* -> development -> main release path. That stopped
    # being safe when sync-development.yml became archive-then-reset: it now
    # resets development to main after EVERY push to main, unconditionally, so
    # a bump merged into development is discarded (recoverable from its
    # archive/* branch, but gone from the branch) as soon as anything lands on
    # main ahead of the next release. Targeting main instead means the bump
    # lands once and the sync carries it into development for free.
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # One grouped PR per week for routine action bumps keeps review load low;
      # a security bump still comes through immediately, ungrouped.
      github-actions:
        patterns:
          - "*"
