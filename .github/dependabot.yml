# Dependabot keeps the SHA-pinned GitHub Actions fresh. Actions are pinned to
# full commit SHAs (with a trailing `# vX.Y.Z` comment) for supply-chain
# safety - see the security-hardening plan, item H9. Dependabot understands
# SHA-pinned actions and will raise PRs that bump both the SHA and the comment
# when a new release ships, so pinning does not mean going stale.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    # Raise bumps against ``development`` (the RC branch), not the default
    # ``main`` - so action updates flow through the normal
    # feature/* -> development -> main release path and never diverge main from
    # development (which would conflict at the next development -> main release).
    #
    # These PRs are never merged as they stand: the bump is verified, folded
    # into a PR of ours against this same branch, and the bot's PR is commented
    # and closed. So what this key really sets is the branch Dependabot
    # *compares against* when deciding whether a bump is still needed, which is
    # why it has to match where the folded work lands.
    #
    # This was briefly pointed at ``main`` on the grounds that
    # sync-development.yml resets development after every push to main and
    # would discard a bump merged there. The hazard is real but it is the sync
    # workflow's to fix (it now refuses to reset over unshipped work); moving
    # the target also pushed our own folded PRs straight to main, skipping the
    # release path this comment exists to protect.
    target-branch: "development"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # One grouped PR per week for routine action bumps keeps review load low;
      # a security bump still comes through immediately, ungrouped.
      github-actions:
        patterns:
          - "*"
